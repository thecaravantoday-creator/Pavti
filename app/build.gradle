plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anganwadi.nashtabhojanpavti'
    compileSdk 35

    defaultConfig {
        applicationId "com.anganwadi.nashtabhojanpavti"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "pavti_helper.apk"
    }
}
